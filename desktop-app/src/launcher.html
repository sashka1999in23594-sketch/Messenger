<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- Окно запуска, как у игровых лаунчеров: проверка обновлений, загрузка, подключение к серверу. Без внешних ресурсов. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' file: data:" />
    <title>Sunnet</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15110f;
        --text: #fff8ef;
        --muted: rgba(255, 244, 230, 0.66);
        --faint: rgba(255, 244, 230, 0.42);
        --track: rgba(255, 255, 255, 0.1);
        --from: #ffd68a;
        --to: #ff8f3f;
        --glow: rgba(255, 170, 80, 0.6);
        --edge: rgba(255, 255, 255, 0.08);
        --ray: 255, 238, 200;
        --danger: #ff8a7a;
        --btn: rgba(0, 0, 0, 0.32);
        --btn-hover: rgba(0, 0, 0, 0.55);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }
      main {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--edge);
        overflow: hidden;
      }
      /* Баннер: закат с лучами — солнце живёт само и тянется к курсору */
      .banner {
        position: relative;
        flex: none;
        height: 176px;
        overflow: hidden;
      }
      .banner img.photo {
        position: absolute;
        left: 50%;
        width: 118%;
        top: 0;
        transform: translate(-50%, var(--py, -150px)) translateX(var(--px, 0px));
        will-change: transform;
      }
      .rays {
        position: absolute;
        left: 50%;
        top: 112px;
        width: 0;
        height: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      .rays i {
        position: absolute;
        width: 900px;
        height: 900px;
        left: -450px;
        top: -450px;
        border-radius: 50%;
        -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.5) 20%, transparent 58%);
        mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.5) 20%, transparent 58%);
        will-change: transform, opacity;
      }
      .sun {
        position: absolute;
        left: 50%;
        top: 112px;
        width: 220px;
        height: 220px;
        margin: -110px 0 0 -110px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 253, 240, 0.95) 0%, rgba(255, 220, 150, 0.5) 14%, rgba(255, 170, 90, 0.14) 40%, transparent 68%);
        mix-blend-mode: screen;
        animation: pulse 3.4s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.14);
          opacity: 0.85;
        }
      }
      .banner::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 55%, var(--bg));
        pointer-events: none;
      }
      .close {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 2;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 8px;
        background: var(--btn);
        color: var(--text);
        font-size: 18px;
        line-height: 30px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .close:hover {
        background: var(--btn-hover);
      }
      .body {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 28px 22px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin-top: -38px;
        border-radius: 17px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 0 3px var(--bg);
        animation: float 3.2s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-3px);
        }
      }
      h1 {
        margin: 10px 0 2px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .status {
        margin: 0 0 16px;
        color: var(--muted);
        min-height: 1.4em;
        text-align: center;
      }
      .status.is-error {
        color: var(--danger);
      }
      .bar {
        position: relative;
        width: 100%;
        height: 6px;
        margin-top: auto;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
      }
      .bar > i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--from), var(--to));
        box-shadow: 0 0 12px var(--glow);
        transition: width 0.3s ease;
      }
      .bar.is-busy > i {
        width: 28% !important;
        animation: busy 1.2s ease-in-out infinite;
      }
      @keyframes busy {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(360%);
        }
      }
      .meta {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 8px;
        min-height: 1.3em;
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="banner" aria-hidden="true">
        <img class="photo" id="photo" src="assets/sunset.jpg" alt="" />
        <div class="rays"><i id="r1"></i><i id="r2"></i></div>
        <div class="sun"></div>
        <button class="close" id="close" type="button" aria-label="Закрыть" title="Закрыть">×</button>
      </div>
      <div class="body">
        <img class="icon" id="icon" src="assets/icon-day.png" alt="" />
        <h1 id="name">Sunnet</h1>
        <p class="status" id="status" role="status" aria-live="polite">Проверяем обновления…</p>
        <div class="bar is-busy" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
        <div class="meta"><span id="left"></span><span id="right"></span></div>
      </div>
    </main>
    <script>
      'use strict';
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      if (params.get('night') === '1') {
        $('icon').src = 'assets/icon-night.png';
        $('name').textContent = 'Lynnet';
      }
      // Закрыть окно запуска — главный процесс видит закрытие и завершает приложение
      $('close').addEventListener('click', () => window.close());

      // ─── Солнце: лучи вращаются и «дышат», тянутся за мышью; без мыши — двигаются сами ──
      let seed = 1022;
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
      function fan(maxAlpha) {
        const stops = [];
        for (let a = 0; a < 360; ) {
          const w = 0.8 + rnd() * 3.4;
          const alpha = (0.3 + rnd() * 0.7) * maxAlpha;
          stops.push(`rgba(var(--ray), 0) ${a.toFixed(2)}deg`, `rgba(var(--ray), ${alpha.toFixed(3)}) ${(a + w / 2).toFixed(2)}deg`, `rgba(var(--ray), 0) ${(a + w).toFixed(2)}deg`);
          a += w + 2 + rnd() * 6;
        }
        return `conic-gradient(${stops.join(', ')})`;
      }
      const r1 = $('r1');
      const r2 = $('r2');
      r1.style.background = fan(0.42);
      r2.style.background = fan(0.26);
      const photo = $('photo');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const pointer = { x: 0.5, y: 0.3, at: -1e9 };
      addEventListener('pointermove', (e) => Object.assign(pointer, { x: e.clientX / innerWidth, y: e.clientY / innerHeight, at: performance.now() }));
      const smooth = { x: 0.5, y: 0.3 };
      function frame(now) {
        const t = now / 1000;
        const idle = now - pointer.at > 2000;
        const tx = idle ? 0.5 + Math.cos(t * 0.5) * 0.35 : pointer.x;
        const ty = idle ? 0.3 + Math.sin(t * 0.7) * 0.2 : pointer.y;
        smooth.x += (tx - smooth.x) * (reduce ? 1 : 0.05);
        smooth.y += (ty - smooth.y) * (reduce ? 1 : 0.05);
        const dx = smooth.x - 0.5;
        const angle = Math.atan2(smooth.y * innerHeight - 112, (smooth.x - 0.5) * innerWidth) * (180 / Math.PI);
        r1.style.transform = `rotate(${(reduce ? 0 : t * 4) + angle * 0.15}deg)`;
        r2.style.transform = `rotate(${(reduce ? 0 : -t * 2.6) - angle * 0.1}deg)`;
        const near = Math.max(0, 1 - Math.hypot(dx, smooth.y - 0.33) * 2);
        r1.style.opacity = (0.6 + near * 0.4 + Math.sin(t * 1.3) * 0.08).toFixed(3);
        r2.style.opacity = (0.45 + near * 0.4 - Math.sin(t * 1.3) * 0.08).toFixed(3);
        photo.style.setProperty('--px', `${(-dx * 16).toFixed(1)}px`);
        photo.style.setProperty('--py', `${(-150 - (smooth.y - 0.3) * 10).toFixed(1)}px`);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // ─── Состояние присылает главный процесс ──────────────────────────────
      const mb = (b) => `${(b / 1048576).toFixed(1)} МБ`;
      let connectStarted = 0;
      let connectTimer = 0;
      function setBar(percent) {
        $('bar').classList.remove('is-busy');
        $('fill').style.width = `${percent}%`;
        $('bar').setAttribute('aria-valuenow', String(Math.round(percent)));
      }
      window.launcher = (s) => {
        const status = $('status');
        status.classList.toggle('is-error', s.phase === 'error');
        clearInterval(connectTimer);
        $('left').textContent = '';
        $('right').textContent = '';
        switch (s.phase) {
          case 'checking':
            $('bar').classList.add('is-busy');
            status.textContent = 'Проверяем обновления…';
            break;
          case 'downloading': {
            const p = Math.max(0, Math.min(100, s.percent || 0));
            setBar(p);
            status.textContent = `Загружаем обновление ${s.version}`;
            $('left').textContent = s.total ? `${mb(s.transferred || 0)} из ${mb(s.total)}` : '';
            $('right').textContent = s.speed ? `${Math.round(p)}% · ${mb(s.speed)}/с` : `${Math.round(p)}%`;
            break;
          }
          case 'installing':
            setBar(100);
            status.textContent = 'Устанавливаем обновление — Sunnet перезапустится сам';
            break;
          case 'connecting': {
            // Сервер просыпается: прогресс идёт плавно, к 30 секундам ~85 %
            connectStarted ||= performance.now();
            const tick = () => {
              const sec = (performance.now() - connectStarted) / 1000;
              const p = Math.min(95, 95 * (1 - Math.exp(-sec / 14)));
              setBar(p);
              $('right').textContent = `${Math.floor(p)}%`;
              status.textContent = sec < 4 ? 'Подключаемся к серверу…' : sec < 15 ? 'Запускаем сервер…' : 'Сервер просыпается после перерыва…';
            };
            tick();
            connectTimer = setInterval(tick, 250);
            break;
          }
          case 'starting':
            setBar(100);
            $('right').textContent = '100%';
            status.textContent = `Запускаем ${$('name').textContent}…`;
            break;
          case 'error':
            setBar(0);
            status.textContent = s.text || 'Что-то пошло не так';
            break;
        }
      };
    </script>
  </body>
</html>
