<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- Выбор, что показать в звонке: экран или окно. Список и миниатюры присылает главный процесс. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>Что показать участникам</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12151c;
        --card: #1a1e27;
        --card-hover: #232836;
        --text: #eef1f7;
        --muted: rgba(238, 241, 247, 0.62);
        --accent: #3d8bff;
        --edge: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 18px 20px 10px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .tabs {
        display: flex;
        gap: 6px;
      }
      .tabs button {
        padding: 7px 14px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      .tabs button.on {
        background: var(--card-hover);
        color: var(--text);
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 6px 20px 12px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
        align-content: start;
      }
      .src {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border: 2px solid transparent;
        border-radius: 12px;
        background: var(--card);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .src:hover {
        background: var(--card-hover);
      }
      .src.on {
        border-color: var(--accent);
      }
      .src img.thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        border-radius: 7px;
        background: #000;
      }
      .src span {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 13px;
      }
      .src span img {
        width: 16px;
        height: 16px;
        flex: none;
      }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px 16px;
        border-top: 1px solid var(--edge);
      }
      footer button {
        padding: 9px 18px;
        border: 0;
        border-radius: 9px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: var(--card-hover);
        color: var(--text);
      }
      footer button.primary {
        background: var(--accent);
        color: #fff;
      }
      footer button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .empty {
        grid-column: 1 / -1;
        color: var(--muted);
        text-align: center;
        padding: 40px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Что показать участникам?</h1>
      <div class="tabs">
        <button type="button" class="on" data-kind="screen">Весь экран</button>
        <button type="button" data-kind="window">Окно</button>
      </div>
    </header>
    <main id="list"></main>
    <footer>
      <button type="button" id="cancel">Отмена</button>
      <button type="button" class="primary" id="share" disabled>Показать</button>
    </footer>
    <script>
      'use strict';
      // Ответ главному процессу — через адрес страницы (#pick:<id> или #cancel)
      const answer = (v) => (location.hash = v);
      let sources = [];
      let kind = 'screen';
      let chosen = null;
      const list = document.getElementById('list');
      const share = document.getElementById('share');
      function render() {
        list.textContent = '';
        const items = sources.filter((s) => s.kind === kind);
        if (!items.length) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = kind === 'screen' ? 'Экранов не нашлось' : 'Открытых окон не нашлось';
          list.appendChild(p);
        }
        for (const s of items) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'src' + (s.id === chosen ? ' on' : '');
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = s.thumb;
          img.alt = '';
          const name = document.createElement('span');
          if (s.icon) {
            const icon = document.createElement('img');
            icon.src = s.icon;
            icon.alt = '';
            name.appendChild(icon);
          }
          name.append(s.name);
          b.append(img, name);
          b.addEventListener('click', () => {
            chosen = s.id;
            share.disabled = false;
            render();
          });
          b.addEventListener('dblclick', () => answer('pick:' + s.id));
          list.appendChild(b);
        }
      }
      for (const t of document.querySelectorAll('.tabs button')) {
        t.addEventListener('click', () => {
          kind = t.dataset.kind;
          document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === t));
          render();
        });
      }
      document.getElementById('cancel').addEventListener('click', () => answer('cancel'));
      share.addEventListener('click', () => chosen && answer('pick:' + chosen));
      addEventListener('keydown', (e) => e.key === 'Escape' && answer('cancel'));
      window.setSources = (list) => {
        sources = list;
        render();
      };
    </script>
  </body>
</html>
