# Render Blueprint: публичное демо Omni в один клик.
# Кнопка «Deploy to Render» в README создаёт сервис по этому файлу.
# На бесплатном тарифе диск временный: после перезапуска база создаётся заново
# с демо-данными. Для постоянного хранения подключите диск (paid) и DATA_DIR=/var/data.
services:
  - type: web
    name: omni
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: cd apps/server && node --disable-warning=ExperimentalWarning dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: ./data
      - key: DEMO_SEED
        value: "true"
      - key: APP_SECRET
        generateValue: true
      # Почта: письма с кодами при регистрации, входе и восстановлении пароля.
      # На бесплатном Render SMTP-порты закрыты — используйте HTTPS-API Brevo (300 писем/день бесплатно).
      # MAIL_FROM — адрес, подтверждённый в Brevo как отправитель, например: Omni <you@gmail.com>
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
