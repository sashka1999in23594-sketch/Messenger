# Render Blueprint: SpaceUp в один клик.
# Кнопка «Deploy to Render» в README создаёт сервис по этому файлу.
# ВНИМАНИЕ: на бесплатном тарифе диск временный — при засыпании, перезапуске
# и деплое файлы сервера стираются. Чтобы данные не пропадали, задайте S3_*
# (бесплатный Backblaze B2, см. README → «Данные не пропадают»): копия базы и
# загрузки хранятся там и восстанавливаются при старте. Другой путь — платный
# тариф Starter + Disk с DATA_DIR=/var/data.
services:
  - type: web
    name: omni
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: cd apps/server && node --disable-warning=ExperimentalWarning dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: ./data
      # Демо-данные (выдуманные пользователи и переписки) — только для показа
      - key: DEMO_SEED
        value: "false"
      - key: APP_SECRET
        generateValue: true
      # Почта: письма с кодами при регистрации, входе и восстановлении пароля.
      # На бесплатном Render SMTP-порты закрыты — используйте HTTPS-API Brevo (300 писем/день бесплатно).
      # MAIL_FROM — адрес, подтверждённый в Brevo как отправитель, например: SpaceUp <you@gmail.com>
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Звонки между разными сетями (мобильный интернет ↔ Wi-Fi) идут через TURN.
      # Бесплатно у Cloudflare: Realtime → TURN Server → создать ключ (Token ID и API Token).
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
      # Хранилище для копии базы и загруженных файлов (S3-совместимое: Backblaze B2, Cloudflare R2, Yandex Object Storage…).
      # B2: Buckets → Create a Bucket (Private) → Endpoint; Application Keys → ключ с доступом Read and Write к этому бакету.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
