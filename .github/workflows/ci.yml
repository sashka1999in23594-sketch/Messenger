name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Аудит зависимостей
        run: npm audit --omit=dev --audit-level=high
      - name: Проверка типов
        run: npm run typecheck
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
